services:
  db:
    image: postgres:16
    container_name: devakaruno-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devakaruno
      POSTGRES_PASSWORD: devakaruno
      POSTGRES_DB: devakaruno_dev
    ports:
      - "5433:5432"
    volumes:
      - devakaruno_pgdata:/var/lib/postgresql/data

volumes:
  devakaruno_pgdata: